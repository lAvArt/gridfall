[package]
name = "gridfall"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
fontdue = "0.9.4"
glam = "0.30"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lyon_tessellation = "1"
pollster = "1.0.1"
serde_json = "1.0.151"
usvg = "0.45"
wgpu = "30.0.1"
winit = "0.30"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
